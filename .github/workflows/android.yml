name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test web voice settings
        run: node tools/test_voice_settings.js
      - name: Prepare offline wake-word model
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/prepare_wakeword.sh
      - name: Check wake-word assets
        run: python3 tools/test_wakeword_assets.py
      - name: Build debug APK
        shell: bash
        run: |
          if ! ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :keytester:testDebugUnitTest :keytester:assembleDebug :buttonhelper:testDebugUnitTest :buttonhelper:assembleDebug > build-output.txt 2>&1; then
            tail -n 80 build-output.txt
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < <(tail -n 35 build-output.txt)
            exit 1
          fi
          cat build-output.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiStation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload button tester APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtonTester-debug
          path: keytester/build/outputs/apk/debug/keytester-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload button helper APK
        uses: actions/upload-artifact@v4
        with:
          name: ButtonHelper-debug
          path: buttonhelper/build/outputs/apk/debug/buttonhelper-debug.apk
          if-no-files-found: error
          retention-days: 14
