<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Вход · Gemini Station</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:#121219;color:#e6e1e9;font:15px/1.5 system-ui,-apple-system,sans-serif}.card{width:min(100%,400px);padding:28px 24px;border:1px solid #373440;border-radius:26px;background:#211f28;box-shadow:0 16px 48px #0003}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:16px;background:#4a3d82;color:#e2d9ff}.logo svg{width:27px;height:27px}.brand strong,.brand span{display:block}.brand strong{font-size:17px;line-height:1.3}.brand span{font-size:12px;color:#bbb5c7}h1{margin:0;font-size:24px;line-height:1.2;letter-spacing:-.03em}p{color:#c4bdcc}p.intro{margin:8px 0 24px}label{display:block;margin-bottom:8px;font-size:13px;font-weight:600}input,button{font:inherit;width:100%;min-height:48px;padding:12px;border-radius:14px}input{color:#f4edf9;background:#16151d;border:1px solid #625b6b;font-size:16px}input:focus-visible,button:focus-visible{outline:2px solid #d0bcff;outline-offset:3px}button{border:0;border-radius:24px;background:#d0bcff;color:#2b1b4c;font-weight:700;margin-top:16px;cursor:pointer}button:hover{background:#e0d1ff}#message{color:#ffb4ab;margin:10px 0 0;min-height:1em;font-size:13px}#message:empty{display:none}@media(max-width:400px){.card{padding:24px 20px}}
</style></head><body><main class="card">
 <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5C13.15 7.4 16.6 10.85 22.5 12c-5.9 1.15-9.35 4.6-10.5 10.5C10.85 16.6 7.4 13.15 1.5 12 7.4 10.85 10.85 7.4 12 1.5Z"/></svg></div><div><strong>Gemini Station</strong><span>Панель управления</span></div></div>
 <h1>С возвращением</h1><p class="intro">Введите пароль для доступа к настройкам станции.</p>
 <form id="login"><label for="password">Пароль панели</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><button type="submit">Войти</button><p id="message" role="status"></p></form>
</main><script>
'use strict';document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password'),message=document.getElementById('message');message.textContent='Проверяем…';try{const response=await fetch('/api/panel-login',{method:'POST',headers:{'Content-Type':'application/json','X-Gemini-Station':'1'},body:JSON.stringify({password:password.value}),cache:'no-store'});password.value='';const data=await response.json();if(!response.ok)throw Error(data.message||'Не удалось войти');location.reload()}catch(error){message.textContent=error.message||'Не удалось войти'}});
</script></body></html>
