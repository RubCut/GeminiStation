<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · Gemini Station</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141218;color:#e6e0e9;font:15px system-ui,sans-serif}.card{width:min(92vw,380px);padding:24px;border-radius:24px;background:#211f26}h1{font-size:24px}p{color:#cac4d0}input,button{font:inherit;width:100%;padding:12px;border-radius:12px}input{color:white;background:#141218;border:1px solid #79747e}button{border:0;background:#d0bcff;color:#241b36;margin-top:12px;cursor:pointer}#message{color:#ffb4ab;min-height:1em}
</style></head><body><main class="card"><h1>Gemini Station</h1><p>Введите пароль панели.</p><form id="login"><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><button type="submit">Войти</button><p id="message" role="status"></p></form></main><script>
'use strict';document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password'),message=document.getElementById('message');message.textContent='Проверяем…';try{const response=await fetch('/api/panel-login',{method:'POST',headers:{'Content-Type':'application/json','X-Gemini-Station':'1'},body:JSON.stringify({password:password.value}),cache:'no-store'});password.value='';const data=await response.json();if(!response.ok)throw Error(data.message||'Не удалось войти');location.reload()}catch(error){message.textContent=error.message||'Не удалось войти'}});
</script></body></html>
