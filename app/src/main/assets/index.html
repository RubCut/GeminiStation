<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gemini Station</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101725;color:#e7eefc}body{max-width:760px;margin:0 auto;padding:24px}h1{margin-bottom:4px}p{line-height:1.5;color:#b7c8e3}section{background:#1b273b;padding:20px;border-radius:12px;margin:16px 0}label{display:block;margin:12px 0 6px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #53647d;border-radius:8px;background:#101725;color:white;font:inherit}button{margin:14px 8px 0 0;padding:10px 16px;border:0;border-radius:8px;background:#a8c7fa;color:#10223d;font-weight:bold;cursor:pointer}button.secondary{background:#384963;color:#fff}pre{white-space:pre-wrap;overflow:auto;max-height:360px;color:#c3d6fa}#message{min-height:1.5em}small{color:#b7c8e3}
</style>
</head>
<body>
<h1>Gemini Station</h1><p>Настройки и журнал устройства</p>
<section id="login"><label for="token">Код доступа с экрана станции</label><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect">Подключиться</button><p>Соединение по HTTP не шифруется. Для безопасности используйте ADB-проброс на localhost.</p></section>
<div id="panel" hidden>
<section><h2>Gemini API</h2><label for="model">Модель</label><input id="model" autocomplete="off"><label for="key">Новый API-ключ</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="Оставьте пустым, чтобы не менять"><button id="save">Сохранить</button><button id="delete" class="secondary">Удалить ключ</button><p id="message" role="status"></p></section>
<section><h2>Журнал</h2><small>Последние 200 событий в памяти; ключи и текст диалогов не записываются.</small><pre id="logs"></pre><button id="refresh" class="secondary">Обновить</button></section>
</div>
<script>
'use strict';
let token='';
const el=id=>document.getElementById(id);
async function request(path,options={}){
 const response=await fetch(path,{...options,headers:{'Authorization':'Bearer '+token,...(options.body?{'Content-Type':'application/json'}:{})},cache:'no-store'});
 const data=await response.json(); if(!response.ok) throw new Error(data.message||'Ошибка'); return data;
}
async function refresh(){try{const data=await request('/api/logs');el('logs').textContent=data.logs.join('\n');return data}catch(e){el('message').textContent=e.message;throw e}}
el('connect').addEventListener('click',async()=>{token=el('token').value.trim();try{const data=await refresh();el('model').value=data.model;el('login').hidden=true;el('panel').hidden=false;el('token').value='';}catch(e){alert(e.message)}});
async function save(remove){try{await request('/api/config',{method:'POST',body:JSON.stringify({model:el('model').value,key:remove?'':el('key').value,deleteKey:remove})});el('key').value='';el('message').textContent=remove?'Ключ удалён':'Настройки сохранены';await refresh()}catch(e){el('message').textContent=e.message}}
el('save').addEventListener('click',()=>save(false));el('delete').addEventListener('click',()=>{if(confirm('Удалить API-ключ?'))save(true)});el('refresh').addEventListener('click',()=>refresh().catch(()=>{}));
setInterval(()=>{if(token && !el('panel').hidden)refresh().catch(()=>{})},5000);
</script>
</body></html>
