plugins { id 'com.android.application' }

android {
    namespace 'ru.geministation'
    compileSdk 35
    // MediaPlayer opens short cue resources by file descriptor.
    androidResources { noCompress += 'wav' }
    defaultConfig {
        applicationId 'ru.geministation'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation files('libs/pocketsphinx.aar')
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
    implementation 'dnsjava:dnsjava:3.6.3'
}

apply from: rootProject.file('gradle/signing.gradle')
